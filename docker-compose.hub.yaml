services:
  api:
    image: TON_USERNAME/system-metrics-agent:latest
    container_name: metrics-api
    ports:
      - "8000:8000"
    environment:
      METRICS_ENDPOINT: http://api:8000/metrics
      COLLECTION_INTERVAL: 5
      REQUEST_TIMEOUT: 5
    networks:
      - metrics-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent:
    image: TON_USERNAME/system-metrics-agent:latest
    container_name: metrics-agent
    environment:
      METRICS_ENDPOINT: http://api:8000/metrics
      COLLECTION_INTERVAL: 5
      REQUEST_TIMEOUT: 5
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metrics-network
    command: ["python", "-m", "app.agent"]

networks:
  metrics-network:
    driver: bridge
